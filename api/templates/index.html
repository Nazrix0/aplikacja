<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDC - Dashboard Pomiarowy</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border);
        }
        .header h1 { margin: 0; color: var(--accent); }
        .header p { margin: 5px 0 0 0; color: var(--text-muted); }
        
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background-color: var(--panel-bg);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }
        .card-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }
        .latest-value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent);
            text-align: center;
            margin: 20px 0;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        .data-table th, .data-table td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        .data-table th { color: var(--text-muted); }
        .pulse {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #22c55e;
            border-radius: 50%;
            margin-right: 8px;
            animation: blink 2s infinite;
        }
        @keyframes blink { 0% {opacity: 1;} 50% {opacity: 0.3;} 100% {opacity: 1;} }
    </style>
</head>
<body>

    <div class="header">
        <h1><span class="pulse"></span> System Monitoringu TDC</h1>
        <p>Lokalny podgląd danych na żywo (Offline Dashboard)</p>
    </div>

    <div class="dashboard">
        <!-- Generowanie kart dla każdego kanału na podstawie konfiguracji Flaska -->
        {% for ch in channels %}
        <div class="card">
            <div class="card-title">KANAŁ WEJŚCIOWY {{ ch }}</div>
            <div class="latest-value" id="latest-val-{{ ch }}">Brak danych...</div>
            
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Czas rejestracji</th>
                        <th>Wartość przeliczona [s]</th>
                    </tr>
                </thead>
                <tbody id="table-body-{{ ch }}">
                    <!-- Dane wypełniane przez JavaScript -->
                </tbody>
            </table>
        </div>
        {% endfor %}
    </div>

    <script>
        // Pobieramy kanały przekazane z backendu
        const channels = {{ channels | tojson }};
        
        async function fetchData() {
            for (let ch of channels) {
                try {
                    const response = await fetch(`/api/dane/${ch}`);
                    const json = await response.json();
                    
                    if (json.dane && json.dane.length > 0) {
                        // Aktualizacja głównego licznika (najnowszy wynik jest pierwszy na liście)
                        const latest = json.dane[0];
                        document.getElementById(`latest-val-${ch}`).innerText = latest.wartosc.toFixed(6);
                        
                        // Aktualizacja tabeli z historią
                        const tbody = document.getElementById(`table-body-${ch}`);
                        tbody.innerHTML = '';
                        
                        // Pokazujemy 5 ostatnich odczytów
                        json.dane.slice(0, 5).forEach(row => {
                            // Formatowanie czasu z ISO na bardziej czytelny
                            const timeStr = new Date(row.timestamp).toLocaleTimeString();
                            
                            const tr = document.createElement('tr');
                            tr.innerHTML = `<td>${timeStr}</td><td>${row.wartosc.toFixed(6)}</td>`;
                            tbody.appendChild(tr);
                        });
                    }
                } catch (error) {
                    console.error(`Błąd pobierania danych dla kanału ${ch}:`, error);
                }
            }
        }

        // Uruchomienie pętli odświeżającej dane co 1 sekundę (1000 ms)
        setInterval(fetchData, 1000);
        
        // Pierwsze pobranie natychmiast po załadowaniu strony
        window.onload = fetchData;
    </script>
</body>
</html>
